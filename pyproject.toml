[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "addons_einvoicing"
authors = [{name = "Addons Technologies"}]
description = "ArdentaxIT and Fynamics UAE e-invoicing connectors for ERPNext"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE"}
dynamic = ["version"]
dependencies = ["requests>=2.31,<3"]

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<17.0.0"
erpnext = ">=15.0.0,<17.0.0"

[tool.flit.sdist]
include = ["tests/", "docs/", "LICENSE"]
exclude = ["**/__pycache__/", "*.pyc"]
